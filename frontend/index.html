<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>МойДом</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              maxPurple: '#6C38FF',
              maxLightPurple: '#F3EEFF',
              maxBlue: '#0085FF'
            }
          }
        }
      }
    </script>
    <script>
      (function() {
        function setupMaxApp() {
          if (window.WebApp) {
            try {
              if (typeof window.WebApp.ready === 'function') {
                window.WebApp.ready();
              }
              if (typeof window.WebApp.expand === 'function') {
                window.WebApp.expand();
              }
              if (typeof window.WebApp.enableClosingConfirmation === 'function') {
                window.WebApp.enableClosingConfirmation();
              }
            } catch (e) {}
          }
        }
        if (document.readyState === 'complete') {
          setupMaxApp();
        } else {
          window.addEventListener('load', setupMaxApp);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
