[supervisord]
nodaemon=true

[program:api]
command=python -m uvicorn backend.main:app --host 0.0.0.0 --port %(ENV_PORT)s
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:bot]
command=python -u /app/bot.py
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr