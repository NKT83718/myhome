services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_home_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_DEMO_CHAT_ID: ${MAX_DEMO_CHAT_ID:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: http://localhost:8000
    container_name: smart_home_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend